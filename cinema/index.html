<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cinema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/style.css">
  <style>
    .sala { position: relative; overflow: hidden; padding: 14px 6% 0; background: #120a0a; border: 3px solid var(--edge); border-radius: 12px;
      box-shadow: inset 0 0 60px #000; }
    .tela { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 4px;
      box-shadow: 0 0 40px rgba(255, 240, 200, .25); transition: box-shadow .8s; }
    .tela iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .tela p { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; padding: 12px; text-align: center;
      font-size: 10px; line-height: 1.8; color: var(--muted); }
    /* cortinas cobrem a sala toda e, abertas, sobram só nas laterais (o padding de 6%) */
    .cortina { position: absolute; top: 0; bottom: 0; width: 50%; z-index: 2; transition: transform 1.6s cubic-bezier(.6, 0, .3, 1);
      background: repeating-linear-gradient(90deg, #8e1010 0 14px, #b71c1c 14px 22px, #6d0b0b 22px 30px);
      box-shadow: inset 0 -30px 30px rgba(0, 0, 0, .5); pointer-events: none; }
    .cortina.esq { left: 0; } .cortina.dir { right: 0; }
    .aberta .cortina.esq { transform: translateX(-88%); }
    .aberta .cortina.dir { transform: translateX(88%); }
    .sanefa { position: relative; z-index: 3; height: 18px; margin: -14px -7% 10px; background: #5a0808;
      border-bottom: 4px solid #d4a017; }
    .resultados { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; max-height: 50vh; overflow-y: auto; }
    .resultados[hidden] { display: none; }
    .resultados button { display: flex; gap: 10px; width: 100%; min-height: 48px; padding: 6px; text-align: left; cursor: pointer;
      color: var(--text); background: var(--panel); border: 3px solid var(--edge); border-radius: 8px; font: 9px/1.6 'Press Start 2P', monospace; }
    .resultados img { width: 120px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 4px; flex-shrink: 0; background: #000; }
    .resultados small { display: block; margin-top: 6px; color: var(--muted); font-size: 8px; }
    .resultados p { margin: 0; padding: 10px; font-size: 9px; line-height: 1.8; color: var(--muted); }
    .resultados a { color: var(--accent); }
    #plateia { display: block; width: 100%; height: auto; margin-top: 8px; }
    form { display: flex; gap: 8px; }
    form input { flex: 1; min-width: 0; min-height: 48px; padding: 0 12px; font: 10px 'Press Start 2P', monospace;
      color: var(--text); background: #170f2e; border: 3px solid var(--edge); border-radius: 8px; }
    form button, #luz { min-height: 48px; padding: 0 14px; font: 10px 'Press Start 2P', monospace; cursor: pointer;
      color: #1a1033; background: var(--accent); border: 0; border-radius: 8px; box-shadow: 0 4px 0 #b3471d; }
    #luz { background: #c9c3ec; box-shadow: 0 4px 0 #3d2e73; }
    body { transition: background .8s; }
    body.escuro { background: #000; }
    body.escuro .hud, body.escuro form, body.escuro .resultados, body.escuro .controls { opacity: .25; transition: opacity .8s; }
    body.escuro .tela { box-shadow: 0 0 80px rgba(255, 240, 200, .45); }
  </style>
</head>
<body>
  <main class="game" style="width: min(760px, 100%)">
    <header class="hud">
      <h1>🎬 Cinema</h1>
      <button id="luz" type="button">💡 Luzes</button>
    </header>

    <form id="form">
      <input id="url" type="text" inputmode="url" placeholder="Buscar vídeo ou colar link" aria-label="Buscar vídeo ou colar link do YouTube" autocomplete="off">
      <button type="submit">🔍 Ir</button>
    </form>
    <ul class="resultados" id="resultados" hidden></ul>

    <div class="sala" id="sala">
      <div class="cortina esq"></div><div class="cortina dir"></div>
      <div class="sanefa"></div>
      <div class="tela" id="tela"><p>Busque um vídeo<br>ou cole um link do YouTube</p></div>
      <canvas id="plateia" width="640" height="110"></canvas>
    </div>

    <div class="chars" id="chars" aria-label="Escolha seu personagem"></div>

    <footer class="controls">
      <a class="back" href="../index.html">← Menu</a>
      <span>Busque ou cole um link e toque em Ir</span>
      <span><kbd>L</kbd> luzes</span>
    </footer>
  </main>
  <script src="../shared/avatars.js"></script>
  <script src="game.js"></script>
  <script src="../shared/retro.js"></script>
</body>
</html>
