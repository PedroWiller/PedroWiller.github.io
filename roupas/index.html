<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guarda-Roupa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/style.css">
  <style>
    .tabs, .items, .colors, .actions { display: grid; gap: 6px; }
    .tabs { grid-template-columns: repeat(5, 1fr); }
    .items { grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); }
    .colors { grid-template-columns: repeat(9, 1fr); }
    .actions { grid-template-columns: 1fr 1fr; }
    .tabs button, .items button {
      display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; padding: 6px 2px;
      font-size: 7px; color: var(--muted); background: var(--panel); border: 3px solid var(--edge); box-shadow: 0 4px 0 #120c26;
    }
    .tabs button b { font-size: 18px; }
    .items canvas { width: 56px; height: 56px; border-radius: 0; }
    .tabs [aria-pressed="true"], .items [aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
    .colors button { aspect-ratio: 1; min-height: 34px; padding: 0; border: 3px solid var(--edge); border-radius: 50%; box-shadow: none; }
    .colors [aria-pressed="true"] { border-color: var(--accent); transform: scale(1.12); }
    .colors[hidden] { display: none; }
    .actions button { min-height: 48px; font-size: 10px; }
  </style>
</head>
<body>
  <main class="game" style="width: min(480px, 100%)">
    <header class="hud">
      <h1>👗 Guarda-Roupa</h1>
      <div class="stats">
        <div class="stat"><span>Estrelas</span><b id="stars">0</b></div>
        <div class="stat"><span>Looks</span><b id="looks">0</b></div>
      </div>
    </header>

    <div class="board">
      <canvas id="game" width="360" height="400"></canvas>
    </div>

    <div class="actions">
      <button id="show">✨ Mostrar look</button>
      <button id="theme">🎲 Novo tema</button>
    </div>

    <div class="tabs" id="tabs" role="group" aria-label="Categoria"></div>
    <div class="items" id="items" role="group" aria-label="Peças"></div>
    <div class="colors" id="colors" role="group" aria-label="Cor"></div>

    <div class="chars" id="chars" aria-label="Escolha seu personagem"></div>

    <footer class="controls">
      <a class="back" href="../index.html">← Menu</a>
      <span>Escolha as peças e as cores, depois mostre o look</span>
    </footer>
  </main>
  <script src="../shared/avatars.js"></script>
  <script src="game.js"></script>
  <script src="../shared/retro.js"></script>
</body>
</html>
