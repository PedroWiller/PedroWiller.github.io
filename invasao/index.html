<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invasão Orbital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/style.css">
</head>
<body>
  <main class="game" style="width: min(760px, 100%)">
    <header class="hud">
      <h1>🛸 Invasão Orbital</h1>
      <div class="stats">
        <div class="stat"><span>Pontos</span><b id="score">0</b></div>
        <div class="stat"><span>Vidas</span><b id="lives">❤❤❤</b></div>
        <div class="stat"><span>Onda</span><b id="wave">1</b></div>
        <div class="stat"><span>Recorde</span><b id="best">0</b></div>
      </div>
    </header>

    <div class="board">
      <canvas id="game" width="720" height="480"></canvas>
      <div class="overlay" id="overlay">
        <p id="title">Os drones chegaram.
Defenda a base!</p>
        <div class="chars" id="chars"></div>
        <button id="start">Começar</button>
      </div>
    </div>

    <div class="pad">
      <div>
        <button data-key="ArrowLeft" aria-label="Esquerda">◀</button>
        <button data-key="ArrowRight" aria-label="Direita">▶</button>
      </div>
      <div><button class="big" data-key=" ">FOGO</button></div>
    </div>

    <footer class="controls">
      <a class="back" href="../index.html">← Menu</a>
      <span><kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd> mover</span>
      <span><kbd>Espaço</kbd> atirar</span>
      <span><kbd>R</kbd> reiniciar</span>
    </footer>
  </main>
  <script src="../shared/avatars.js"></script>
  <script src="game.js"></script>
  <script src="../shared/touch.js"></script>
  <script src="../shared/retro.js"></script>
</body>
</html>
