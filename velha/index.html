<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jogo da Velha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/style.css">
</head>
<body>
  <main class="game" style="width: min(760px, 100%)">
    <header class="hud">
      <h1>#️⃣ Jogo da Velha</h1>
      <div class="stats">
        <div class="stat"><span>Você</span><b id="score-p">0</b></div>
        <div class="stat"><span>Empates</span><b id="score-d">0</b></div>
        <div class="stat"><span>CPU</span><b id="score-c">0</b></div>
      </div>
    </header>

    <div class="chars" id="chars" aria-label="Escolha seu personagem"></div>

    <div class="board">
      <canvas id="game" width="720" height="400" style="cursor: pointer"></canvas>
      <div id="overlay" class="overlay" hidden>
        <p id="overlay-title"></p>
        <button id="restart">Jogar de novo</button>
      </div>
    </div>

    <footer class="controls">
      <a class="back" href="../index.html">← Menu</a>
      <span>Clique ou <kbd>1</kbd>-<kbd>9</kbd> jogar</span>
      <span><kbd>R</kbd> reiniciar</span>
    </footer>
  </main>
  <script src="../shared/avatars.js"></script>
  <script src="game.js"></script>
  <script src="../shared/retro.js"></script>
</body>
</html>
