<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caça-Gosma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/style.css">
</head>
<body>
  <main class="game" style="width: min(560px, 100%)">
    <header class="hud">
      <h1>🟢 Caça-Gosma</h1>
      <div class="stats">
        <div class="stat"><span>Pontos</span><b id="score">0</b></div>
        <div class="stat"><span>Fase</span><b id="level">1</b></div>
        <div class="stat"><span>Gosmas</span><b id="left">0</b></div>
        <div class="stat"><span>Recorde</span><b id="best">0</b></div>
      </div>
    </header>

    <div class="board">
      <canvas id="game" width="360" height="400" style="touch-action: none"></canvas>
      <div id="overlay" class="overlay" hidden>
        <p id="overlay-title"></p>
        <button id="restart">Jogar de novo</button>
      </div>
    </div>

    <div class="pad">
      <div style="display:grid;grid-template-columns:repeat(3,64px);gap:6px">
        <span></span><button data-key="ArrowUp" aria-label="Andar">▲</button><span></span>
        <button data-key="ArrowLeft" aria-label="Virar à esquerda">↺</button><span></span><button data-key="ArrowRight" aria-label="Virar à direita">↻</button>
        <span></span><button data-key="ArrowDown" aria-label="Recuar">▼</button><span></span>
      </div>
      <div><button class="big" data-key=" ">FOGO</button></div>
    </div>

    <div class="chars" id="chars" aria-label="Escolha seu personagem"></div>

    <footer class="controls">
      <a class="back" href="../index.html">← Menu</a>
      <span><kbd>↑</kbd><kbd>↓</kbd> / <kbd>W</kbd><kbd>S</kbd> andar</span>
      <span><kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd> virar</span>
      <span><kbd>Espaço</kbd> atirar</span>
      <span><kbd>R</kbd> reiniciar</span>
    </footer>
  </main>
  <script src="../shared/avatars.js"></script>
  <script src="game.js"></script>
  <script src="../shared/touch.js"></script>
  <script src="../shared/retro.js"></script>
</body>
</html>
