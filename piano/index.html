<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Piano</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/style.css">
  <style>
    .songbar { display: flex; flex-wrap: wrap; gap: 8px; }
    .songbar select {
      flex: 1 1 100%; min-height: 48px; padding: 0 10px; font: inherit; font-size: 10px;
      color: var(--text); background: var(--panel); border: 3px solid var(--edge); border-radius: 8px;
    }
    .songbar button { flex: 1; min-height: 48px; font-size: 10px; }
    .songbar button:disabled { opacity: .35; cursor: default; }
  </style>
</head>
<body>
  <main class="game" style="width: min(440px, 100%)">
    <header class="hud">
      <h1>🎹 Piano</h1>
      <div class="stats">
        <div class="stat"><span>Notas</span><b id="notes">-</b></div>
        <div class="stat"><span>Erros</span><b id="errors">0</b></div>
        <div class="stat"><span>Seguidas</span><b id="streak">0</b></div>
      </div>
    </header>

    <div class="songbar">
      <select id="song" aria-label="Música"></select>
      <button id="listen">▶ Ouvir</button>
      <button id="again">↺ Do início</button>
    </div>

    <div class="board">
      <canvas id="game" width="360" height="540" style="touch-action: none"></canvas>
    </div>

    <div class="chars" id="chars" aria-label="Escolha seu personagem"></div>

    <footer class="controls">
      <a class="back" href="../index.html">← Menu</a>
      <span>Toque nas teclas</span>
      <span><kbd>A</kbd>-<kbd>Ç</kbd> brancas, <kbd>W</kbd><kbd>E</kbd><kbd>T</kbd><kbd>Y</kbd><kbd>U</kbd><kbd>O</kbd><kbd>P</kbd> pretas</span>
    </footer>
  </main>
  <script src="../shared/avatars.js"></script>
  <script src="game.js"></script>
  <script src="../shared/retro.js"></script>
</body>
</html>
