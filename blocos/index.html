<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blocos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/style.css">
</head>
<body>
  <main class="game" style="width: min(760px, 100%)">
    <header class="hud">
      <h1>🧱 Blocos</h1>
      <div class="stats">
        <div class="stat"><span>Pontos</span><b id="score">0</b></div>
        <div class="stat"><span>Linhas</span><b id="lines">0</b></div>
        <div class="stat"><span>Nível</span><b id="level">1</b></div>
        <div class="stat"><span>Recorde</span><b id="best">0</b></div>
      </div>
    </header>

    <div class="board">
      <canvas id="game" width="720" height="480"></canvas>
      <div id="overlay" class="overlay" hidden>
        <p id="overlay-title"></p>
        <button id="restart">Jogar de novo</button>
      </div>
    </div>

    <div class="pad">
      <div>
        <button data-key="ArrowLeft" data-repeat aria-label="Esquerda">◀</button>
        <button data-key="ArrowDown" data-repeat aria-label="Descer">▼</button>
        <button data-key="ArrowRight" data-repeat aria-label="Direita">▶</button>
      </div>
      <div>
        <button data-key="p" aria-label="Pausar">⏸</button>
        <button data-key=" " aria-label="Soltar">⤓</button>
        <button class="big" data-key="ArrowUp" aria-label="Girar">↻</button>
      </div>
    </div>

    <div class="chars" id="chars" aria-label="Escolha seu personagem"></div>

    <footer class="controls">
      <a class="back" href="../index.html">← Menu</a>
      <span><kbd>←</kbd><kbd>→</kbd> mover</span>
      <span><kbd>↑</kbd><kbd>Z</kbd> girar</span>
      <span><kbd>↓</kbd> descer</span>
      <span><kbd>Espaço</kbd> soltar</span>
      <span><kbd>P</kbd> pausar</span>
      <span><kbd>R</kbd> reiniciar</span>
    </footer>
  </main>
  <script src="../shared/avatars.js"></script>
  <script src="game.js"></script>
  <script src="../shared/touch.js"></script>
  <script src="../shared/retro.js"></script>
</body>
</html>
