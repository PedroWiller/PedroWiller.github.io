<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Torre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/style.css">
</head>
<body>
  <main class="game" style="width: min(440px, 100%)">
    <header class="hud">
      <h1>🏗 Torre</h1>
      <div class="stats">
        <div class="stat"><span>Altura</span><b id="score">0</b></div>
        <div class="stat"><span>Recorde</span><b id="best">0</b></div>
      </div>
    </header>

    <div class="board">
      <canvas id="game" width="360" height="600" style="touch-action: none; cursor: pointer"></canvas>
      <div id="overlay" class="overlay" hidden>
        <p id="overlay-title"></p>
        <button id="restart">Jogar de novo</button>
      </div>
    </div>

    <div class="chars" id="chars" aria-label="Escolha seu personagem"></div>

    <footer class="controls">
      <a class="back" href="../index.html">← Menu</a>
      <span>Toque, <kbd>Espaço</kbd> ou <kbd>Enter</kbd> soltar</span>
      <span><kbd>R</kbd> reiniciar</span>
    </footer>
  </main>
  <script src="../shared/avatars.js"></script>
  <script src="game.js"></script>
  <script src="../shared/retro.js"></script>
</body>
</html>
