<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dobra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/style.css">
  <style>
    .diffs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .diffs button {
      display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 48px; padding: 8px 4px;
      font-size: 9px; color: var(--muted); background: var(--panel); border: 3px solid var(--edge); box-shadow: 0 4px 0 #120c26;
    }
    .diffs small { font-size: 8px; }
    .diffs button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  </style>
</head>
<body>
  <main class="game" style="width: min(440px, 100%)">
    <header class="hud">
      <h1>🔢 Dobra</h1>
      <div class="stats">
        <div class="stat"><span>Pontos</span><b id="score">0</b></div>
        <div class="stat"><span>Maior</span><b id="max">2</b></div>
        <div class="stat"><span>Recorde</span><b id="best">0</b></div>
      </div>
    </header>

    <div class="diffs" id="diffs" role="group" aria-label="Dificuldade">
      <button data-diff="facil">FÁCIL<small>5×5</small></button>
      <button data-diff="normal">NORMAL<small>4×4</small></button>
      <button data-diff="dificil">DIFÍCIL<small>3×3</small></button>
    </div>

    <div class="board">
      <canvas id="game" width="360" height="440" style="touch-action: none"></canvas>
      <div id="overlay" class="overlay" hidden>
        <p id="overlay-title"></p>
        <button id="restart">Jogar de novo</button>
      </div>
    </div>

    <div class="chars" id="chars" aria-label="Escolha seu personagem"></div>

    <footer class="controls">
      <a class="back" href="../index.html">← Menu</a>
      <span>Deslize ou <kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> / <kbd>WASD</kbd> mover</span>
      <span><kbd>R</kbd> reiniciar</span>
    </footer>
  </main>
  <script src="../shared/avatars.js"></script>
  <script src="game.js"></script>
  <script src="../shared/retro.js"></script>
</body>
</html>
