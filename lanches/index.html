<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lanchonete Turbo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/style.css">
  <style>
    .pantry { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; }
    .pantry button {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 6px 2px; font-size: 7px; line-height: 1.3;
      color: var(--text); background: var(--panel); border: 3px solid var(--edge); box-shadow: 0 4px 0 #120c26;
    }
    .pantry button:hover { border-color: var(--accent); }
    .pantry canvas { width: 42px; height: 30px; border-radius: 0; }
    .pantry small { color: var(--accent); font-size: 8px; }
    @media (max-width: 560px) {
      .pantry { grid-template-columns: repeat(5, 1fr); }
      .pantry span { display: none; } /* no celular fica só ícone + número */
    }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .actions button { padding: 10px 16px; }
    #trash { background: #ff7043; }
    #serve { background: #66bb6a; box-shadow: 0 5px 0 #2e7d32; }
  </style>
</head>
<body>
  <main class="game" style="width: min(820px, 100%)">
    <header class="hud">
      <h1>🍔 Lanchonete Turbo</h1>
      <div class="stats">
        <div class="stat"><span>Moedas</span><b id="coins">0</b></div>
        <div class="stat"><span>Servidos</span><b id="served">0</b></div>
        <div class="stat"><span>Vidas</span><b id="lives">❤❤❤</b></div>
        <div class="stat"><span>Recorde</span><b id="best">0</b></div>
      </div>
    </header>

    <div class="board">
      <canvas id="stage" width="800" height="340"></canvas>
      <div class="overlay" id="overlay">
        <p id="title">Monte o lanche
na ordem do pedido!</p>
        <div class="chars" id="chars"></div>
        <button id="start">Abrir a lanchonete</button>
      </div>
    </div>

    <div class="pantry" id="pantry"></div>
    <div class="actions">
      <button id="trash">🗑 Jogar fora <small>⌫</small></button>
      <button id="serve">✔ Servir <small>Enter</small></button>
    </div>

    <footer class="controls">
      <a class="back" href="../index.html">← Menu</a>
      <span><kbd>1</kbd>-<kbd>9</kbd> ingredientes</span>
      <span><kbd>Enter</kbd> servir · <kbd>⌫</kbd> jogar fora</span>
    </footer>
  </main>
  <script src="../shared/avatars.js"></script>
  <script src="game.js"></script>
  <script src="../shared/retro.js"></script>
</body>
</html>
